name: Release

# Builds the Windows and Linux packages and attaches them to a GitHub release
# whenever a version tag (v1.2.3) is pushed.

on:
  push:
    tags:
      - 'v*'

# id-token and attestations let GitHub sign a statement, for each file
# published, that it was built by this workflow from this repository at this
# tag. Anyone can check a download against it:
#     gh attestation verify FILE --repo kalashnikovski/cvn_node
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The node itself is vetted; internal/randomx is third-party code kept as published.
      - run: go vet . ./node
      - run: go test ./...
      # The RandomX engine, built with the published settings, must give
      # RandomX's own published test values.
      - run: go test -tags randomx_reference ./internal/randomx/
      # The built wallet screens kept in the repository are compiled into the
      # program. They must be exactly what their source builds to, so that
      # nothing in the program is taken on trust.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Check the wallet screens against their source
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          git diff --exit-code -- dist

  windows:
    name: Windows package
    needs: test
    runs-on: windows-latest
    steps:
      # Git on Windows rewrites the line endings of text files as it fetches
      # them, and some of those files are built into the programs. Switched
      # off, so that the programs are built from the same bytes everywhere
      # and anyone can rebuild them and get the same result.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # CGO_ENABLED=0 for both: neither program uses C code, and with it
      # switched on the result depends on the machine that builds it, so
      # nobody could rebuild the programs and compare them with these.
      - name: Build the miner
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -tags server -ldflags="-s -w" -o cvn_miner.exe .

      - name: Build the desktop wallet
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -tags "desktop,production" -ldflags="-s -w -H windowsgui" -o cvn_node.exe .

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path package/cvn_node | Out-Null
          Copy-Item cvn_miner.exe, cvn_node.exe, LaunchMiner.bat, LaunchWallet.bat, explorer.html, README.md, Installation_Guide.md, MINING_GUIDE.md, POOL_GUIDE.md, POOL_DESIGN.md, WHITEPAPER.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination package/cvn_node
          Compress-Archive -Path package/cvn_node -DestinationPath cvn_node_windows.zip
          # The SHA-256 of the package and of each program in it, so that
          # anyone can check a download, or a build of their own, against it.
          Get-FileHash -Algorithm SHA256 cvn_node_windows.zip, cvn_miner.exe, cvn_node.exe |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii SHA256SUMS_windows.txt

      # A tag with "-rc" in it is a release candidate and is published as a
      # pre-release, so that it is never shown as the latest version. The
      # release's text is RELEASE_NOTES.md as it stands at the tag.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: RELEASE_NOTES.md
          files: |
            cvn_node_windows.zip
            SHA256SUMS_windows.txt

      # After publishing, so that a fault in signing never holds a release
      # back: the files are out, and this job shows the fault.
      - name: Sign what was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            cvn_node_windows.zip
            cvn_miner.exe
            cvn_node.exe

  linux:
    name: Linux package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build for Intel/AMD and ARM
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p package/cvn_node_linux_amd64 package/cvn_node_linux_arm64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o package/cvn_node_linux_amd64/cvn_node .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o package/cvn_node_linux_arm64/cvn_node .

      - name: Package
        run: |
          for arch in amd64 arm64; do
            cp explorer.html README.md Installation_Guide.md MINING_GUIDE.md POOL_GUIDE.md POOL_DESIGN.md WHITEPAPER.md LICENSE THIRD_PARTY_NOTICES.md package/cvn_node_linux_$arch/
            tar -C package -czf cvn_node_linux_$arch.tar.gz cvn_node_linux_$arch
          done
          # The SHA-256 of each package and of the program in it, so that
          # anyone can check a download, or a build of their own, against it.
          sha256sum cvn_node_linux_amd64.tar.gz cvn_node_linux_arm64.tar.gz > SHA256SUMS_linux.txt
          (cd package && sha256sum cvn_node_linux_amd64/cvn_node cvn_node_linux_arm64/cvn_node) >> SHA256SUMS_linux.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: RELEASE_NOTES.md
          files: |
            cvn_node_linux_amd64.tar.gz
            cvn_node_linux_arm64.tar.gz
            SHA256SUMS_linux.txt

      - name: Sign what was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            cvn_node_linux_amd64.tar.gz
            cvn_node_linux_arm64.tar.gz
            package/cvn_node_linux_amd64/cvn_node
            package/cvn_node_linux_arm64/cvn_node
