name: Site

# Publishes the folder site/ as the project's web pages (GitHub Pages)
# whenever something in it changes on main. Nothing is built: the pages are
# plain files.
#
# It needs Pages switched on once, in the repository's settings:
# Settings, Pages, Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages cannot send response headers, so each page says in its own
      # head how much a visitor's browser tells the sites they go on to
      # (Lockpick finding LP-SMGKMY). A page without the line is not published.
      - name: Every page limits what it tells other sites
        run: |
          missing=$(grep -rL --include='*.html' '<meta name="referrer" content="strict-origin-when-cross-origin">' site || true)
          if [ -n "$missing" ]; then
            echo "These pages lack the referrer line:"
            echo "$missing"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
