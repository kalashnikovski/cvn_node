name: Site

# Publishes the folder site/ as the project's web pages (GitHub Pages)
# whenever something in it changes on main. Nothing is built: the pages are
# plain files.
#
# It needs Pages switched on once, in the repository's settings:
# Settings, Pages, Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pages cannot send response headers, so each page says in its own
      # head how much a visitor's browser tells the sites they go on to
      # (Lockpick finding LP-SMGKMY). A page without the line is not published.
      - name: Every page limits what it tells other sites
        run: |
          missing=$(grep -rL --include='*.html' '<meta name="referrer" content="strict-origin-when-cross-origin">' site || true)
          if [ -n "$missing" ]; then
            echo "These pages lack the referrer line:"
            echo "$missing"
            exit 1
          fi
      # The pages also say what they may load: their own style sheet and
      # script, and answers from the seeds; nothing written into the page
      # itself (Lockpick findings LP-4SJ838 and LP-WFHY62). A script or a
      # style written into a page would be refused by the browser, so a page
      # that has one, or lacks the policy, is not published.
      - name: Every page says what it may load
        run: |
          bad=0
          for page in $(find site -name '*.html'); do
            grep -q '<meta http-equiv="Content-Security-Policy" content="default-src '"'"'none'"'"';' "$page" || { echo "$page: no content policy"; bad=1; }
            grep -q "object-src 'none'; base-uri 'none'; form-action 'none'" "$page" || { echo "$page: the policy lacks object-src, base-uri or form-action"; bad=1; }
            if grep -nE '<script>|<script [^>]*[^c]>|<style|[[:space:]]style=|[[:space:]]on[a-z]+=' "$page" | grep -v '<script src="[^"]*"></script>'; then
              echo "$page: a script, style or handler is written into the page"; bad=1
            fi
          done
          exit $bad
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
