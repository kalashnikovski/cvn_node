name: Tests

# Runs the test suite and builds every variant on each push and pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The project's own code is vetted; internal/randomx is third-party code kept as published.
      - run: go vet . ./node
      # The whole suite takes eight to nine minutes on a fast desktop; go's
      # own limit of ten is too near.
      - run: go test -timeout 30m ./...
      # The RandomX engine, built with the published settings, must give
      # RandomX's own published test values.
      - run: go test -tags randomx_reference ./internal/randomx/
      # The built wallet screens kept in the repository are compiled into the
      # program. They must be exactly what their source builds to, so that
      # nothing in the program is taken on trust.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Check the wallet screens against their source
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          git diff --exit-code -- dist
      - name: Build for Linux
        env:
          CGO_ENABLED: '0'
        run: go build -o cvn_node .
      - name: Build the Windows miner
        env:
          CGO_ENABLED: '0'
          GOOS: windows
        run: go build -tags server -o cvn_miner.exe .
