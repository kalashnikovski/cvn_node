name: Tests

# Runs the test suite and builds every variant on each push and pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The project's own code is vetted; internal/randomx is third-party code kept as published.
      - run: go vet . ./node
      - run: go test ./...
      # The RandomX engine, built with the published settings, must give
      # RandomX's own published test values.
      - run: go test -tags randomx_reference ./internal/randomx/
      - name: Build for Linux
        env:
          CGO_ENABLED: '0'
        run: go build -o cvn_node .
      - name: Build the Windows miner
        env:
          CGO_ENABLED: '0'
          GOOS: windows
        run: go build -tags server -o cvn_miner.exe .
